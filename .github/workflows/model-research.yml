name: Model research daily 10:00 CST
on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write, actions: read}
jobs:
  run:
    uses: ./.github/workflows/_research.yml
    with: {topic: model_research}
    secrets: inherit
