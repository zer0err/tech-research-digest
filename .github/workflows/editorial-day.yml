name: Daily report at 09:00 Asia/Taipei

on:
  schedule:
    # 09:00 Asia/Taipei = 01:00 UTC. GitHub may start this late; catchup retries the same edition.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Only the daily report is published
        required: true
        default: daily_report
        type: choice
        options:
          - daily_report

permissions: {contents: write, pages: write, id-token: write, actions: read}

jobs:
  compensate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/catchup.yml
    secrets: inherit
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.slot.outputs.value }}
    steps:
      - id: slot
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          echo "value=$MANUAL_SLOT" >> "$GITHUB_OUTPUT"
  run:
    needs: resolve
    uses: ./.github/workflows/_editorial.yml
    with:
      slot: ${{ needs.resolve.outputs.slot }}
    secrets: inherit
