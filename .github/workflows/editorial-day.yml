name: Hourly AI editorial day 09:00-18:00 CST

on:
  schedule:
    - cron: "7 1 * * *"
    - cron: "17 2 * * *"
    - cron: "27 3 * * *"
    - cron: "37 4 * * *"
    - cron: "47 5 * * *"
    - cron: "7 6 * * *"
    - cron: "17 7 * * *"
    - cron: "27 8 * * *"
    - cron: "37 9 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Content slot to run
        required: true
        default: morning_radar
        type: choice
        options:
          - morning_radar
          - model_research
          - open_source
          - paper_brief
          - prompt_engineering
          - core_research
          - dev_practice
          - applied_ai
          - ecosystem
          - daily_digest

permissions: {contents: write, pages: write, id-token: write, actions: read}

jobs:
  compensate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/catchup.yml
    secrets: inherit
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.slot.outputs.value }}
    steps:
      - id: slot
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_SLOT" ]; then
            value="$MANUAL_SLOT"
          else
            case "$SCHEDULE" in
              "7 9 * * *") value="morning_radar" ;;
              "17 10 * * *") value="model_research" ;;
              "27 11 * * *") value="open_source" ;;
              "37 12 * * *") value="paper_brief" ;;
              "47 13 * * *") value="prompt_engineering" ;;
              "7 14 * * *") value="core_research" ;;
              "17 15 * * *") value="dev_practice" ;;
              "27 16 * * *") value="applied_ai" ;;
              "37 17 * * *") value="ecosystem" ;;
              "47 18 * * *") value="daily_digest" ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
  run:
    needs: resolve
    uses: ./.github/workflows/_editorial.yml
    with:
      slot: ${{ needs.resolve.outputs.slot }}
    secrets: inherit

