name: AI editorial day with one daily notification at 19:00 Beijing

on:
  schedule:
    - cron: "7 1 * * *"
    - cron: "17 2 * * *"
    - cron: "27 3 * * *"
    - cron: "37 4 * * *"
    - cron: "47 5 * * *"
    - cron: "7 6 * * *"
    - cron: "17 7 * * *"
    - cron: "27 8 * * *"
    - cron: "37 9 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Content slot to run
        required: true
        default: morning_radar
        type: choice
        options:
          - morning_radar
          - model_research
          - open_source
          - paper_brief
          - prompt_engineering
          - core_research
          - dev_practice
          - applied_ai
          - ecosystem
          - daily_digest

permissions: {contents: write, pages: write, id-token: write, actions: read}

jobs:
  compensate:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/catchup.yml
    secrets: inherit
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.slot.outputs.value }}
    steps:
      - id: slot
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          echo "value=$MANUAL_SLOT" >> "$GITHUB_OUTPUT"
  run:
    needs: resolve
    uses: ./.github/workflows/_editorial.yml
    with:
      slot: ${{ needs.resolve.outputs.slot }}
    secrets: inherit
