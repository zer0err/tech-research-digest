name: Domain rotation and daily report (UTC+8)

on:
  schedule:
    # 09:00, 13:00, 17:00 domain drafts; 18:00 one combined edition.
    - cron: "0 1,5,9,10 * * *"
  workflow_dispatch:

permissions: {contents: write, pages: write, id-token: write, actions: read}

jobs:
  rotate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/_rotation.yml
    secrets: inherit
