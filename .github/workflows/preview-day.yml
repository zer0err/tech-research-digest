name: Preview the daily report
on:
  workflow_dispatch:
    inputs:
      mode:
        description: test = legacy audit preview only; production = run due rotation work
        type: choice
        default: test
        options: [test, production]
permissions: {contents: write, pages: write, id-token: write, actions: read}
jobs:
  preview:
    if: inputs.mode == 'test'
    uses: ./.github/workflows/_editorial.yml
    with: {slot: daily_report, mode: test}
    secrets: inherit
  rotate:
    if: inputs.mode == 'production' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/_rotation.yml
    secrets: inherit
