name: Preview the daily report
on:
  workflow_dispatch:
    inputs:
      mode:
        description: test = audit only; production = publish the one daily report
        type: choice
        default: test
        options: [test, production]
permissions: {contents: write, pages: write, id-token: write, actions: read}
jobs:
  daily_report:
    uses: ./.github/workflows/_editorial.yml
    with: {slot: daily_report, mode: "${{ inputs.mode }}"}
    secrets: inherit
