name: Edge AI Monday 14:00 CST
on:
  schedule:
    - cron: "0 14 * * 1"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
concurrency:
  group: research-state-writer-v2
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
jobs:
  run:
    uses: ./.github/workflows/_research.yml
    with:
      topic: edge_ai
    secrets: inherit

