name: Replay one past daily report
on:
  workflow_dispatch:
    inputs:
      date:
        description: Past Asia/Taipei edition date (YYYY-MM-DD); preserve an existing daily report
        required: true
        type: string
permissions: {contents: write, pages: write, id-token: write, actions: read}
concurrency:
  group: editorial-replay-day
  cancel-in-progress: false
jobs:
  replay:
    uses: ./.github/workflows/_editorial.yml
    with:
      slot: daily_report
      replay_date: ${{ inputs.date }}
    secrets: inherit
