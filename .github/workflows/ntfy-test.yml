name: Test ntfy notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Send ntfy test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL || 'https://ntfy.sh' }}
        run: python -c 'from research_bot.core import send_ntfy; assert send_ntfy("ntfy 连接测试成功。", title="VORASIO 通知测试", click_url="https://vorasio.com/")'
