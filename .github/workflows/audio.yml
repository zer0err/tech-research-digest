name: Audio research Friday 09:00 CST
on:
  schedule:
    - cron: "0 9 * * 5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
concurrency:
  group: research-state-writer
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
jobs:
  run:
    uses: ./.github/workflows/_research.yml
    with:
      topic: audio
    secrets: inherit

