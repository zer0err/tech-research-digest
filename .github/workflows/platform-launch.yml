name: Notify platform launch

on:
  workflow_run:
    workflows: [Deploy research blog]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: editorial-state-writer-v1
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Require the verified deployment to be the current source
        id: release
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$DEPLOYED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        if: steps.release.outputs.current == 'true'
        with:
          python-version: '3.13'
      - name: Install dependencies
        if: steps.release.outputs.current == 'true'
        run: python -m pip install --requirement requirements.txt
      - name: Verify public pages and claim campaign
        if: steps.release.outputs.current == 'true'
        id: claim
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python -m research_bot.launch claim --sha "$DEPLOYED_SHA"
      - name: Persist claim before any message is sent
        if: steps.claim.outputs.claimed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/platform-launch.json
          git commit -m "state: claim platform launch notification [skip ci]"
          git push origin HEAD:main
      - name: Send one launch notification
        if: steps.claim.outputs.claimed == 'true'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m research_bot.launch send --sha "$DEPLOYED_SHA"
      - name: Persist delivery outcome even when unconfirmed
        if: always() && steps.claim.outputs.claimed == 'true'
        run: |
          git add state/platform-launch.json
          git diff --cached --quiet || git commit -m "state: record platform launch delivery [skip ci]"
          git push origin HEAD:main
