name: Catch up overdue rotation slots
on:
  schedule:
    # Same scheduler, not an independent clock. Recovery revisits the planned cutoffs.
    - cron: "19,49 1-15 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {contents: write, pages: write, id-token: write, actions: read}

jobs:
  recover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/_rotation.yml
    secrets: inherit
