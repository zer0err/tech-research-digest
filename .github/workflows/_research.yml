name: Research preview (does not publish)

on:
  workflow_call:
    inputs:
      topic:
        required: true
        type: string
    secrets:
      OPENALEX_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Preview unseen items without analysis, publication, or state writes
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GH_SOURCE_TOKEN: ${{ github.token }}
        run: python -m research_bot.main --topic "${{ inputs.topic }}" --dry-run
