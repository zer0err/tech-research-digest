<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc"><title id="title">AI 生态的七个观察层</title><desc id="desc">模型、推理接入、知识工具支持智能体运行与业务搭建，最终形成编程应用及通用专业应用。各层可以直接组合，并非每个产品都需要全部层。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="360" height="1000" rx="16" fill="#f8f7f1"/><text x="20" y="34.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="start">能力怎样变成产品？</text><text x="20" y="62.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start">按角色读图，并非固定技术流水线</text><rect x="20" y="92" width="320" height="104" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="123.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">01 模型</text><text x="38" y="153.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">理解、推理、生成</text><path d="M180,200 L180,222" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="228" width="320" height="104" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="259.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">02 推理与接入</text><text x="38" y="289.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">运行模型 · 提供调用入口</text><path d="M180,336 L180,358" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="364" width="320" height="104" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="395.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">03 知识与工具</text><text x="38" y="425.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">查资料 · 读文件 · 操作网页</text><path d="M180,472 L180,494" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="500" width="320" height="104" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="38" y="531.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">04 框架与运行时</text><text x="38" y="561.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">执行、记进度、处理错误</text><path d="M180,608 L180,630" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="636" width="320" height="104" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="667.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">05 工作流与搭建</text><text x="38" y="697.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">业务流程 · 连接系统 · 发布</text><path d="M180,744 L180,771" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="800.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="650" text-anchor="middle">应用层的两条分支</text><rect x="20" y="822" width="320" height="72" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="853.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">06 编程与软件创造</text><text x="38" y="883.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">开发 · 调试 · 创建应用</text><rect x="20" y="909" width="320" height="72" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="940.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">07 通用与专业应用</text><text x="38" y="970.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">研究 · 办公 · 视觉与语音</text></svg>
