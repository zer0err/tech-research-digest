<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc"><title id="title">RAG 与微调分别改变什么</title><desc id="desc">RAG 在使用时检索相关资料，把证据交给现有模型，通常不改变模型参数。微调用训练样本更新模型参数，以调整稳定行为或任务表现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="360" height="1000" rx="16" fill="#f8f7f1"/><text x="20" y="34.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="start">查资料，还是调整模型？</text><rect x="14" y="62" width="332" height="441" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="32" y="97.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="650" text-anchor="start">RAG：把资料带进当前回答</text><rect x="32" y="121" width="296" height="92" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="50" y="152.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">问题 + 资料库</text><text x="50" y="182.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">检索相关片段</text><rect x="32" y="246" width="296" height="92" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="50" y="277.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">现有模型 + 证据</text><text x="50" y="307.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">基于资料生成回答</text><path d="M180,220 L180,238" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="383.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">得到：有资料依据的回答</text><text x="32" y="407.8" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">通常不修改模型参数</text><text x="32" y="455.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start">适合：制度、手册、经常更新的资料</text><rect x="14" y="527" width="332" height="452" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="32" y="563.0" fill="#956924" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="650" text-anchor="start">微调：通过训练调整模型</text><rect x="32" y="590" width="296" height="92" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="50" y="621.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">训练样本 + 基础模型</text><text x="50" y="651.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">输入示例，执行额外训练</text><path d="M180,687 L180,712" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="722" width="296" height="92" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="50" y="753.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">参数更新后的模型</text><text x="50" y="783.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">调整任务行为或输出风格</text><text x="32" y="858.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">得到：模型参数发生变化</text><text x="32" y="882.8" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">仍需评测，仍可能需要检索</text><text x="32" y="942.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start">适合：稳定的任务行为与表达模式</text></svg>
