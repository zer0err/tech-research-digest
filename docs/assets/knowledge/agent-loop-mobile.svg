<svg xmlns="http://www.w3.org/2000/svg" width="360" height="866" viewBox="0 0 360 866" role="img" aria-labelledby="title desc"><title id="title">智能体怎样通过反馈完成任务</title><desc id="desc">接收目标后查看信息，决定行动，调用工具，再检查结果。未完成时带着反馈继续；达到条件时交付；缺少权限或信息时请求人工帮助。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="360" height="866" rx="16" fill="#f8f7f1"/><text x="20" y="34.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="start">Agent 的关键：反馈循环</text><rect x="32" y="65" width="296" height="91" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="50" y="96.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">01 接收目标</text><text x="50" y="126.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">先明确什么叫完成</text><path d="M180,161 L180,181" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="188" width="296" height="91" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="50" y="219.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">02 查看信息</text><text x="50" y="249.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">读取当前资料和任务状态</text><path d="M180,284 L180,304" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="311" width="296" height="91" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="50" y="342.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">03 决定行动</text><text x="50" y="372.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">选择下一步与可用工具</text><path d="M180,407 L180,427" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="434" width="296" height="91" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="50" y="465.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">04 执行并检查</text><text x="50" y="495.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">调用工具，查看真实结果</text><path d="M180,530 L180,554" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="564" width="296" height="78" rx="12" fill="#e8f0e9" stroke="#176453" stroke-width="1.5"/><text x="180" y="596.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="650" text-anchor="middle">达到完成条件了吗？</text><text x="180" y="622.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="middle">看结果，不能只看模型说完成</text><path d="M180,649 L180,678" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="689" width="296" height="73" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="50" y="720.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">完成 → 交付结果</text><text x="50" y="750.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">附上依据或验证结果</text><path d="M28,606 L12,606 L12,224 L28,224" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="32" y="798.0" fill="#956924" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">未完成 → 带着反馈继续</text><text x="32" y="822.8" fill="#956924" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">缺少信息或权限 → 请人协助</text></svg>
