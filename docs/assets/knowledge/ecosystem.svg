<svg xmlns="http://www.w3.org/2000/svg" width="900" height="664" viewBox="0 0 900 664" role="img" aria-labelledby="title desc"><title id="title">AI 生态的七个观察层</title><desc id="desc">模型、推理接入、知识工具支持智能体运行与业务搭建，最终形成编程应用及通用专业应用。各层可以直接组合，并非每个产品都需要全部层。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="900" height="664" rx="16" fill="#f8f7f1"/><text x="30" y="40.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="650" text-anchor="start">能力怎样变成产品？</text><text x="30" y="72.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">先看基础能力，再看执行组织，最后看用户拿到什么。</text><rect x="30" y="105" width="268" height="104" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="48" y="136.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">01 模型</text><text x="48" y="166.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">理解 · 推理 · 生成</text><path d="M164,214 L164,255" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="105" width="268" height="104" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="334" y="136.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">02 推理与接入</text><text x="334" y="166.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">运行模型 · 提供调用入口</text><path d="M450,214 L450,255" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="602" y="105" width="268" height="104" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="620" y="136.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">03 知识与工具</text><text x="620" y="166.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">检索资料 · 连接外部操作</text><path d="M736,214 L736,255" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="265" width="840" height="92" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="48" y="296.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">04 智能体框架与运行时 / Harness</text><text x="48" y="326.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">执行循环 · 上下文 · 工具调度 · 状态与恢复</text><path d="M450,362 L450,390" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="400" width="840" height="92" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="48" y="431.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">05 工作流与搭建平台</text><text x="48" y="461.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">将模型、工具与执行能力组合成业务流程</text><path d="M450,497 L450,516" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,516 L236,516 L236,546" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,516 L664,516 L664,546" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="553" width="412" height="86" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="48" y="584.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">06 编程与软件创造</text><text x="48" y="614.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">代码修改 · 软件开发 · 应用原型</text><rect x="458" y="553" width="412" height="86" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="476" y="584.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">07 通用与专业应用</text><text x="476" y="614.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">研究 · 办公 · 图像 · 视频 · 语音</text></svg>
