<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Model、Harness 与 Agent 的关系</title><desc id="desc">Agent 是面向目标的完整系统。Harness 组织执行并调度模型、工具和状态；模型负责理解和生成，工具连接外部环境。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="900" height="580" rx="16" fill="#f8f7f1"/><text x="30" y="40.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="650" text-anchor="start">三个概念，各管什么？</text><rect x="30" y="68" width="840" height="407" rx="12" fill="#e8f0e9" stroke="#176453" stroke-width="1.5"/><text x="52" y="102.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="650" text-anchor="start">Agent：围绕目标观察、行动、检查的完整系统</text><text x="52" y="133.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">例：修复登录问题，并把验证通过的修改交给用户。</text><rect x="55" y="155" width="790" height="291" rx="12" fill="white" stroke="#176453" stroke-width="1.5" stroke-dasharray="7 5"/><text x="77" y="190.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">Harness：组织执行，调度模型、工具与状态</text><rect x="80" y="215" width="310" height="142" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="98" y="246.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">Model / 模型</text><text x="98" y="276.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">理解上下文</text><text x="98" y="302.35" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">生成方案与工具调用请求</text><rect x="480" y="215" width="340" height="142" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="498" y="246.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">Tools / 工具</text><text x="498" y="276.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">读取和修改项目文件</text><text x="498" y="302.35" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">运行测试，返回实际结果</text><path d="M398,267 L470,267" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><path d="M474,307 L398,307" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="406.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">Context &amp; State：资料与进度     ·     权限、错误恢复与执行追踪</text><path d="M650,479 L650,505" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="516" width="840" height="44" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="450" y="544.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle">外部环境：代码库、文件、浏览器、业务系统</text></svg>
