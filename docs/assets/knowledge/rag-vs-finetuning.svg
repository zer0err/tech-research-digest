<svg xmlns="http://www.w3.org/2000/svg" width="900" height="526" viewBox="0 0 900 526" role="img" aria-labelledby="title desc"><title id="title">RAG 与微调分别改变什么</title><desc id="desc">RAG 在使用时检索相关资料，把证据交给现有模型，通常不改变模型参数。微调用训练样本更新模型参数，以调整稳定行为或任务表现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="900" height="526" rx="16" fill="#f8f7f1"/><text x="30" y="40.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="650" text-anchor="start">查资料，还是调整模型？</text><rect x="30" y="72" width="405" height="430" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><rect x="465" y="72" width="405" height="430" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="50" y="110.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="start">RAG：把资料带进当前回答</text><rect x="50" y="137" width="365" height="87" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="68" y="168.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">问题 + 资料库</text><text x="68" y="198.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">先检索相关片段</text><path d="M232,230 L232,255" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="266" width="365" height="88" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="68" y="297.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">现有模型 + 检索证据</text><text x="68" y="327.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">基于资料生成回答</text><text x="50" y="395.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">通常不修改模型参数</text><text x="50" y="421.35" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">适合：制度、手册与更新频繁的资料</text><text x="485" y="110.0" fill="#956924" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="start">微调：通过训练调整模型</text><rect x="485" y="137" width="365" height="87" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="503" y="168.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">训练样本 + 基础模型</text><text x="503" y="198.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">执行额外训练</text><path d="M667,230 L667,255" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="266" width="365" height="88" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="503" y="297.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">参数更新后的模型</text><text x="503" y="327.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">调整任务行为或输出风格</text><text x="485" y="395.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">会修改模型参数</text><text x="485" y="421.35" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">适合：稳定任务行为与表达模式</text><text x="485" y="469.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start">两者可以结合，微调后仍可能需要 RAG。</text></svg>
