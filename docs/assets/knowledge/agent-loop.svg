<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454" role="img" aria-labelledby="title desc"><title id="title">智能体怎样通过反馈完成任务</title><desc id="desc">接收目标后查看信息，决定行动，调用工具，再检查结果。未完成时带着反馈继续；达到条件时交付；缺少权限或信息时请求人工帮助。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="900" height="454" rx="16" fill="#f8f7f1"/><text x="30" y="40.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="650" text-anchor="start">Agent 的关键：反馈循环</text><text x="30" y="72.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">一个任务可能经历多轮观察、行动与验证。</text><rect x="30" y="110" width="200" height="113" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="48" y="141.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">01 接收目标</text><text x="48" y="171.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">先明确什么叫完成</text><path d="M234,166 L244,166" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="249" y="110" width="200" height="113" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="267" y="141.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">02 查看信息</text><text x="267" y="171.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">读取当前资料</text><text x="267" y="197.35" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">与任务状态</text><path d="M453,166 L463,166" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="468" y="110" width="200" height="113" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="486" y="141.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">03 决定行动</text><text x="486" y="171.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">选择下一步</text><text x="486" y="197.35" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">与可用工具</text><path d="M672,166 L682,166" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="687" y="110" width="200" height="113" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="705" y="141.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">04 执行并检查</text><text x="705" y="171.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">调用工具</text><text x="705" y="197.35" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">查看真实结果</text><path d="M787,228 L787,268" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="280" width="267" height="100" rx="12" fill="#e8f0e9" stroke="#176453" stroke-width="1.5"/><text x="754" y="316.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="middle">达到完成条件？</text><text x="754" y="350.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle">完成 → 交付结果</text><path d="M616,330 L349,330 L349,229" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="385" y="309.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">未完成：带着反馈继续</text><text x="30" y="414.0" fill="#956924" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">缺少信息、权限或遇到无法处理的问题 → 请求人工帮助</text></svg>
