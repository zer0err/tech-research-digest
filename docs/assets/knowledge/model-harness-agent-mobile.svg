<svg xmlns="http://www.w3.org/2000/svg" width="360" height="866" viewBox="0 0 360 866" role="img" aria-labelledby="title desc"><title id="title">Model、Harness 与 Agent 的关系</title><desc id="desc">Agent 是面向目标的完整系统。Harness 组织执行并调度模型、工具和状态；模型负责理解和生成，工具连接外部环境。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="360" height="866" rx="16" fill="#f8f7f1"/><text x="20" y="34.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="start">三个概念，各管什么？</text><rect x="14" y="63" width="332" height="692" rx="12" fill="#e8f0e9" stroke="#176453" stroke-width="1.5"/><text x="30" y="96.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">Agent：面向目标的完整系统</text><text x="30" y="124.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">例：修复登录问题并验证结果</text><rect x="30" y="148" width="300" height="579" rx="12" fill="white" stroke="#176453" stroke-width="1.5" stroke-dasharray="7 5"/><text x="47" y="181.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">Harness：组织与调度执行</text><rect x="46" y="207" width="268" height="101" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="64" y="238.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">Model / 模型</text><text x="64" y="268.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">理解信息，决定下一步</text><path d="M180,313 L180,342" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="46" y="352" width="268" height="94" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="64" y="383.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">Tools / 工具</text><text x="64" y="413.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">读文件、改代码、运行测试</text><path d="M180,452 L180,481" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="46" y="490" width="268" height="94" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="64" y="521.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">Context &amp; State</text><text x="64" y="551.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">资料、任务进度、运行结果</text><text x="49" y="621.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">权限 · 错误恢复 · 执行追踪</text><text x="49" y="645.8" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">让每一步可管理、可检查</text><path d="M180,760 L180,785" fill="none" stroke="#176453" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="797" width="320" height="50" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="180" y="829.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle">外部环境：项目、浏览器、业务系统</text></svg>
