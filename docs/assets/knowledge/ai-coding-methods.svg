<svg xmlns="http://www.w3.org/2000/svg" width="900" height="382" viewBox="0 0 900 382" role="img" aria-labelledby="title desc"><title id="title">三种 AI 编程方式的关注点</title><desc id="desc">Vibe coding 通过描述需求、运行和反馈探索原型；AI 辅助编程强调设计、审查和验证；规格驱动开发先明确需求与验收再实现。三者可结合，不是固定成熟度阶梯。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="900" height="382" rx="16" fill="#f8f7f1"/><text x="30" y="40.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="650" text-anchor="start">同样用 AI，工作方式不同</text><text x="30" y="72.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">区别主要在人怎样组织工作、审查和验收。</text><rect x="30" y="105" width="266" height="200" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="48" y="136.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">Vibe coding</text><text x="48" y="166.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">描述想法 → 生成与运行</text><text x="48" y="192.35" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">看效果 → 继续反馈</text><text x="48" y="270.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">关注：快速探索与原型</text><rect x="317" y="105" width="266" height="200" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="335" y="136.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">AI 辅助编程</text><text x="335" y="166.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">明确设计 → AI 协助实现</text><text x="335" y="192.35" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">审查修改 → 测试验证</text><text x="335" y="270.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">关注：理解、验证与维护</text><rect x="604" y="105" width="266" height="200" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="622" y="136.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="650" text-anchor="start">规格驱动开发</text><text x="622" y="166.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">写清需求与验收标准</text><text x="622" y="192.35" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start">AI 实现 → 对照标准验收</text><text x="622" y="270.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">关注：需求边界与协作</text><text x="30" y="350.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start">可以先探索原型，再补齐规格与验证；三种方式可以结合。</text></svg>
