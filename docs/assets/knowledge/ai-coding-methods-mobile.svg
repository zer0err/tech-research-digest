<svg xmlns="http://www.w3.org/2000/svg" width="360" height="773" viewBox="0 0 360 773" role="img" aria-labelledby="title desc"><title id="title">三种 AI 编程方式的关注点</title><desc id="desc">Vibe coding 通过描述需求、运行和反馈探索原型；AI 辅助编程强调设计、审查和验证；规格驱动开发先明确需求与验收再实现。三者可结合，不是固定成熟度阶梯。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176453"/></marker></defs><rect width="360" height="773" rx="16" fill="#f8f7f1"/><text x="20" y="34.0" fill="#192522" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="650" text-anchor="start">同样用 AI，工作方式不同</text><rect x="20" y="70" width="320" height="185" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="101.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">Vibe coding</text><text x="38" y="131.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">描述想法 → 生成与运行</text><text x="38" y="155.8" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">看效果 → 继续反馈</text><text x="38" y="221.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">关注：快速探索与原型</text><rect x="20" y="286" width="320" height="185" rx="12" fill="#176453" stroke="#176453" stroke-width="1.5"/><text x="38" y="317.0" fill="white" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">AI 辅助编程</text><text x="38" y="347.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">明确设计 → AI 协助实现</text><text x="38" y="371.8" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">审查修改 → 测试验证</text><text x="38" y="437.0" fill="#e0eee6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">关注：理解、验证与维护</text><rect x="20" y="502" width="320" height="185" rx="12" fill="white" stroke="#ccd6cd" stroke-width="1.5"/><text x="38" y="533.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" text-anchor="start">规格驱动开发</text><text x="38" y="563.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">写清需求与验收标准</text><text x="38" y="587.8" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">AI 实现 → 对照标准验收</text><text x="38" y="653.0" fill="#176453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">关注：需求边界与协作</text><text x="20" y="744.0" fill="#596b61" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start">可以组合使用，不是固定的升级阶梯。</text></svg>
