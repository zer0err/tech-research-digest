# 每日出版时刻、模型条数和失败重试的唯一配置。
# 只发布一份日报：Asia/Taipei 09:00。UTC cron 是这个时刻减 8 小时。
# 采集截止也是当天 09:00，不用补跑时的墙钟，避免把上午之后的新条目写进当期。
# GitHub Actions 的 cron 可能晚启动；到点之后的 catchup 仍只补这一期，不保证准点送达。
timezone: Asia/Taipei
analysis_item_limit: 3
empty_rescan_minutes: 180
failure_retry_minutes: 60
max_attempts: 3
publication_history_limit: 400
slots:
  daily_report:
    time: "09:00"
    label: "VORASIO AI 日报"
    category: "日报"
    page_title: "VORASIO AI 日报"
    cadence: "每日 09:00"
    special: daily_report
    publish_key: daily_report
