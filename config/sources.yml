topics:
  model_research:
    title: "AI 模型、训练与基础研究"
    analysis_focus: "模型架构、预训练与后训练、推理能力、数据方法、评测可靠性；重点区分通用能力提升与特定应用。"
    lookback_hours: 72
    max_items: 6
    keywords: [model, pretrain, post-train, reasoning, alignment, reinforcement learning, multimodal, transformer, language model]
    exclude_any: [quantization, pruning, model compression, tinyml, on-device, ai accelerator, npu, fpga, asic, robot, embodied, vision-language-action]
    sources:
      - name: arXiv Model Research
        url: "https://export.arxiv.org/api/query?search_query=cat:cs.LG+OR+cat:cs.CL+OR+cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=80"
  efficient_ai:
    title: "高效 AI、模型压缩与端侧适配"
    analysis_focus: "参数量、精度、量化位宽、剪枝或蒸馏方法、内存、延迟、吞吐、功耗和目标设备；明确质量与资源之间的权衡。"
    lookback_hours: 216
    max_items: 7
    keywords: [quantization, pruning, distillation, compression, low-rank, sparse, tinyml, on-device, small model]
    sources:
      - name: arXiv Efficient AI
        url: "https://export.arxiv.org/api/query?search_query=all:quantization+OR+all:pruning+OR+all:distillation+OR+all:%22model%20compression%22+OR+all:TinyML+OR+all:%22on-device%22&sortBy=submittedDate&sortOrder=descending&max_results=80"
  inference_systems:
    title: "推理引擎、编译器与嵌入式系统"
    analysis_focus: "编译器、运行时、算子与内存优化、异构调度、CPU/GPU/NPU 协同、实时性及边云协同；优先报告可复现的系统性能。"
    lookback_hours: 240
    max_items: 7
    keywords: [inference, compiler, runtime, kernel, operator, scheduling, serving, embedded, memory]
    sources:
      - name: arXiv Inference Systems
        url: "https://export.arxiv.org/api/query?search_query=all:%22inference%20engine%22+OR+all:%22machine%20learning%20compiler%22+OR+all:%22inference%20runtime%22+OR+all:%22edge%20inference%22+OR+all:%22embedded%20AI%22&sortBy=submittedDate&sortOrder=descending&max_results=80"
  ai_hardware:
    title: "AI 芯片、计算架构与硬件平台"
    analysis_focus: "NPU/GPU/DSP/FPGA/ASIC 架构、存储与互连、吞吐、延迟、功耗、面积、制程和软硬件协同；不要把纯算法论文当作芯片进展。"
    lookback_hours: 264
    max_items: 7
    keywords: [accelerator, npu, fpga, asic, risc-v, chip, compute-in-memory, neuromorphic]
    required_any: [ai, artificial intelligence, machine learning, neural network, deep learning, llm]
    sources:
      - name: arXiv AI Hardware
        url: "https://export.arxiv.org/api/query?search_query=all:%22AI%20accelerator%22+OR+all:NPU+OR+all:FPGA+OR+all:ASIC+OR+all:%22compute-in-memory%22+OR+all:neuromorphic&sortBy=submittedDate&sortOrder=descending&max_results=80"
  multimodal:
    title: "多模态感知、音视频与人机交互"
    analysis_focus: "视觉、语音、音频、雷达及传感器融合的任务定义、数据集、质量指标、实时性与交互条件；指出单模态和多模态贡献。"
    lookback_hours: 264
    max_items: 8
    keywords: [vision, image, video, audio, speech, acoustic, sensor, multimodal, radar, lidar, interaction]
    exclude_any: [robot, robotic, embodied, vision-language-action, manipulation, autonomous navigation]
    sources:
      - name: arXiv Perception
        url: "https://export.arxiv.org/api/query?search_query=cat:cs.CV+OR+cat:cs.SD+OR+cat:eess.AS&sortBy=submittedDate&sortOrder=descending&max_results=100"
  embodied:
    title: "Agent、机器人与具身智能"
    analysis_focus: "规划、记忆、工具或设备调用、VLA、世界模型、导航、操作与控制、仿真到现实及失败模式；弱化与真实环境无关的纯浏览器 Agent。"
    lookback_hours: 264
    max_items: 8
    keywords: [robot, robotic, embodied, agent, vision-language-action, manipulation, navigation, world model, control, sim-to-real]
    sources:
      - name: arXiv Embodied Intelligence
        url: "https://export.arxiv.org/api/query?search_query=all:robot+OR+all:robotic+OR+all:embodied+OR+all:%22vision-language-action%22+OR+all:%22world%20model%22&sortBy=submittedDate&sortOrder=descending&max_results=100"
  product_safety:
    title: "智能硬件产品化、可靠性与安全"
    analysis_focus: "设备功耗与热管理、隐私、安全、鲁棒性、OTA、监控、故障诊断、量产测试与合规；区分实验原型和具备产品化证据的方案。"
    lookback_hours: 336
    max_items: 7
    keywords: [iot, device, hardware, privacy, security, robust, reliability, fault, thermal, power, firmware, ota]
    sources:
      - name: arXiv Hardware Reliability
        url: "https://export.arxiv.org/api/query?search_query=all:%22IoT%20security%22+OR+all:%22device%20privacy%22+OR+all:%22hardware%20reliability%22+OR+all:%22fault%20diagnosis%22+OR+all:%22edge%20security%22&sortBy=submittedDate&sortOrder=descending&max_results=80"

